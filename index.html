<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务依赖科技树</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171e29'/%3E%3Cpath d='M8 10h8v12h8' fill='none' stroke='%2354ce97' stroke-width='3'/%3E%3Ccircle cx='8' cy='10' r='4' fill='%2354ce97'/%3E%3Ccircle cx='24' cy='22' r='4' fill='%23e7c980'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20261004-nav1"></head>
<body><header><div><h1>任务依赖科技树</h1><p id="summary">读取同一张任务表，不复制卡片</p></div><button id="refresh">刷新</button></header>
<section id="config" hidden><label>数据源 <select id="table-select"></select></label><button id="save">保存配置</button><span>只读，不修改任务或积分。</span></section>
<nav><label>查找 <input id="search" placeholder="编号、任务或负责人"></label><label>岗位 <select id="role"><option value="">全部</option><option>程序</option><option>美术</option><option>策划</option></select></label><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">全图</button><button id="reset">清晰视图</button></nav>
<div class="legend"><span class="done">✓ 已完成</span><span class="doing">进行中</span><span class="review">待验收</span><span class="ready">可开工</span><span class="locked">前置未完成</span><span id="navigation-hint">滚轮缩放 · 按住中键拖动 · 点击卡片看详情</span></div>
<p id="notice" role="status">连接中…</p><main><div id="canvas" aria-describedby="navigation-hint"><div id="empty"><h2>尚未读取任务</h2><p>添加到飞书仪表盘并选择任务表后，显示真实依赖与状态。</p><p>已完成亮绿并带勾；所有前置完成后，后续任务才亮起。</p></div><svg id="map" role="group" aria-label="任务依赖图"></svg></div><aside id="detail" hidden><button id="close-detail">关闭详情</button><h2 id="detail-title"></h2><p id="detail-meta"></p><p id="detail-deps"></p><p id="detail-body"></p><button id="open-record">打开飞书原卡</button></aside></main><script type="module" src="app.js?v=20261004-nav1"></script></body></html>
